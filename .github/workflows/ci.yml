# CI for every pull request and every push to main (ADR 0014): format only. Uses no secret and no signing.
# Each module is its own job, so they run in parallel and a finding names its module. Builds and tests run
# locally before a pull request (.okf/workflows/build.md, section CI).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.2"

jobs:
  format:
    name: format (${{ matrix.module }})
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            path: TwakeChat
          - module: domain
            path: Packages/Domain
          - module: matrixdata
            path: Packages/MatrixData
          - module: designsystem
            path: Packages/DesignSystem
          - module: appshared
            path: Packages/AppShared
          - module: features
            path: Packages/Features
          - module: scripts
            path: scripts
    steps:
      - uses: actions/checkout@v4

      # swift-format ships with Xcode; the pinned Xcode decides its version.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcrun swift-format --version

      - name: swift-format lint ${{ matrix.path }}
        run: scripts/lint.sh "${{ matrix.path }}"
