# E2E XCUITest against a local Synapse (issue #83, ADR 0014).
#
# Tradeoff: GitHub-hosted macos-26 runners are Apple Silicon and cannot run
# Docker or Colima (no nested virtualization). docker/setup-docker-action also
# fails on those ARM images. macos-15-intel can run Colima until ~August 2027
# and currently ships Xcode 26.x, so Synapse and the simulator share
# http://localhost:8008. A Linux Synapse job plus a tunnel would keep macos-26
# for Xcode, but Matrix server_name "localhost" and the random tunnel hostname
# do not mix without regenerating the homeserver per run. If this image loses
# Xcode 26.2, this job will fail at "Select Xcode" and that split should be
# revisited.
name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.2"

jobs:
  e2e:
    name: e2e (Synapse + XCUITest)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show runner and Xcode apps
        run: |
          uname -ms
          ls /Applications/Xcode*.app
          xcodebuild -version || true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Set up Docker (Colima)
        uses: docker/setup-docker-action@v4

      - name: Run E2E suite
        run: scripts/e2e.sh all
        env:
          # scripts/e2e.sh picks a present iPhone if this name is missing.
          SIMULATOR_NAME: iPhone 16e

      - name: Upload xcresult and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-xcresult
          path: |
            build/e2e.xcresult
            build/e2e.log
          if-no-files-found: warn
          retention-days: 7
