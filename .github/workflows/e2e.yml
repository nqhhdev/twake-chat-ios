# E2E XCUITest against a local Synapse (issue #83).
#
# Manual (`workflow_dispatch`) and once a week: a macOS runner billed at 10× would
# exhaust the Actions minutes if this ran on every pull request, so it is not a
# required check of main. Run it from the Actions tab, or `scripts/e2e.sh all`
# locally.
#
# Tradeoff if you do dispatch it: GitHub-hosted macos-26 (Apple Silicon) cannot
# run Docker or Colima. macos-15-intel can run Colima until ~August 2027 and
# currently ships Xcode 26.x, so Synapse and the simulator share
# http://localhost:8008. timeout-minutes is 90 — enough for a cold SDK build and
# the eleven flows on an Intel runner, short enough that a stuck Colima start
# cannot drain the remaining minutes.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Synapse + XCUITest)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show runner and Xcode apps
        run: |
          uname -ms
          ls /Applications/Xcode*.app
          xcodebuild -version || true

      - name: Select the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Set up Docker (Colima)
        uses: docker/setup-docker-action@v4

      - name: Run E2E suite
        run: scripts/e2e.sh all
        env:
          SIMULATOR_NAME: iPhone 16e

      - name: Upload xcresult and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-xcresult
          path: |
            build/e2e.xcresult
            build/e2e.log
          if-no-files-found: warn
          retention-days: 7
