# E2E XCUITest against a local Synapse (issue #83).
#
# Manual only (`workflow_dispatch`): a macOS runner billed at 10× would exhaust
# the Actions minutes if this ran on every pull request. Run it from the Actions
# tab, or run `scripts/e2e.sh all` locally.
#
# Tradeoff if you do dispatch it: GitHub-hosted macos-26 (Apple Silicon) cannot
# run Docker or Colima. macos-15-intel can run Colima until ~August 2027 and
# currently ships Xcode 26.x, so Synapse and the simulator share
# http://localhost:8008. timeout-minutes is 50 — enough for a cold SDK build and
# the suite, short enough that a stuck Colima/start cannot drain the remaining
# minutes.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.2"

jobs:
  e2e:
    name: e2e (Synapse + XCUITest)
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Show runner and Xcode apps
        run: |
          uname -ms
          ls /Applications/Xcode*.app
          xcodebuild -version || true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Set up Docker (Colima)
        uses: docker/setup-docker-action@v5

      - name: Run E2E suite
        run: scripts/e2e.sh all
        env:
          SIMULATOR_NAME: iPhone 16e

      - name: Upload xcresult and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult
          path: |
            build/e2e.xcresult
            build/e2e.log
          if-no-files-found: warn
          retention-days: 7
