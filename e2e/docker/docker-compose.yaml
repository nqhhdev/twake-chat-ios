# Minimal Synapse for Twake Chat iOS E2E (no ToM, Dex, or LDAP). Used when
# twake-space-chat/e2e is not checked out, including GitHub Actions.
#
# Config is copied from /config into a named volume at start so the process can
# write the database and media store. A bind mount of /data itself was read-only
# on GitHub's macos-15-intel + Colima runner, and mounting files over /data
# also left /data unwritable.
name: twake-ios-e2e

services:
  synapse:
    image: ghcr.io/element-hq/synapse:v1.162.0
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /config/homeserver.yaml /data/homeserver.yaml
        cp /config/log.config /data/localhost.log.config
        cp /config/localhost.signing.key /data/localhost.signing.key
        chmod 644 /data/localhost.signing.key
        exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml
    volumes:
      - synapse-data:/data
      - ./homeserver.yaml:/config/homeserver.yaml:ro
      - ./log.config:/config/log.config:ro
      - ./localhost.signing.key:/config/localhost.signing.key:ro
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8008/_matrix/client/versions')",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  synapse-data:
